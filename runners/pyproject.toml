[project]
name = "creator-lab-runners"
version = "0.1.0"
description = "creator-lab runners: CPU jobs (downloads, captions, features). The TRIBE runner uses BrainThing's venv."
requires-python = ">=3.12"
dependencies = [
    "yt-dlp==2026.8.19",  # pinned: YouTube changes often; bump deliberately,
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108", "B008", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["runners"]
