[project]
name = "creator-lab"
version = "0.1.0"
description = "creator-lab backend: Flask API, ingest, scheduler"
authors = [
    { name = "ewitulsk", email = "55603389+ewitulsk@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler<4",
    "cryptography>=50.0.2",
    "flask>=3.1.3",
    "flask-limiter>=4.1.1",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tzdata>=2026.5",
]

[project.scripts]
creator-lab = "creator_lab:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv.build-backend]
module-name = "creator_lab"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:.get_engine. is deprecated:DeprecationWarning", "ignore:datetime.datetime.utcnow:DeprecationWarning:flask_login"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108", "B008"]
