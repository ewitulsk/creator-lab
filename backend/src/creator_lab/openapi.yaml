openapi: 3.1.0
info:
  title: creator-lab API
  version: 0.1.0
  description: |
    REST API for the creator-lab platform. Browser calls use a session cookie
    (log in via /api/auth/login) and must send `X-Requested-With` on writes.
    Runners use `Authorization: Bearer <RUNNER_TOKEN>`.
servers:
  - url: /
security:
  - session: []
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
    runner:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    User:
      type: object
      required: [id, username]
      properties:
        id: { type: integer }
        username: { type: string }
    UserResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }
    DiskReport:
      type: object
      required: [drive_total, drive_free, drive_used, data_bytes, folders, measured_at]
      properties:
        drive_total: { type: integer }
        drive_free: { type: integer }
        drive_used: { type: integer }
        data_bytes: { type: integer }
        folders:
          type: object
          additionalProperties: { type: integer }
        measured_at: { type: number }
    Quota:
      type: object
      required: [day, units, calls, budget]
      properties:
        day: { type: string }
        units: { type: integer }
        calls: { type: integer }
        budget: { type: integer }
    RunnerSummary:
      type: object
      required: [id, name, type, online, last_heartbeat]
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string }
        online: { type: boolean }
        last_heartbeat: { type: [string, "null"] }
    DashboardError:
      type: object
      required: [kind, id, title, detail, at]
      properties:
        kind: { type: string, enum: [job, channel] }
        id: { type: integer }
        title: { type: string }
        detail: { type: string }
        at: { type: [string, "null"] }
    Dashboard:
      type: object
      required: [counts, videos_by_format, jobs_by_status, runners, errors, disk, quota]
      properties:
        counts:
          type: object
          required: [channels, videos, video_snapshots, channel_snapshots, assets, results_done, studies]
          properties:
            channels: { type: integer }
            videos: { type: integer }
            video_snapshots: { type: integer }
            channel_snapshots: { type: integer }
            assets: { type: integer }
            results_done: { type: integer }
            studies: { type: integer }
        videos_by_format:
          type: object
          additionalProperties: { type: integer }
        jobs_by_status:
          type: object
          additionalProperties: { type: integer }
        runners:
          type: array
          items: { $ref: "#/components/schemas/RunnerSummary" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/DashboardError" }
        disk: { $ref: "#/components/schemas/DiskReport" }
        quota: { $ref: "#/components/schemas/Quota" }
    Schedules:
      type: object
      required:
        - snapshot_young_days
        - snapshot_young_interval_hours
        - snapshot_old_interval_hours
        - channel_snapshot_interval_hours
        - new_upload_check_hours
        - scheduler_tick_minutes
        - daily_quota_budget
        - runner_timeout_minutes
        - download_pause_seconds
        - backup_interval_hours
        - backups_to_keep
      properties:
        snapshot_young_days: { type: integer }
        snapshot_young_interval_hours: { type: integer }
        snapshot_old_interval_hours: { type: integer }
        channel_snapshot_interval_hours: { type: integer }
        new_upload_check_hours: { type: integer }
        scheduler_tick_minutes: { type: integer }
        daily_quota_budget: { type: integer }
        runner_timeout_minutes: { type: integer }
        download_pause_seconds: { type: integer }
        backup_interval_hours: { type: integer }
        backups_to_keep: { type: integer }
    Settings:
      type: object
      required: [keys, data_root, brainthing_dir, max_video_height, schedules, disk, quota]
      properties:
        keys:
          type: object
          description: Whether each secret is set. Values are never returned.
          required: [youtube_api_key, runner_token, secret_key]
          properties:
            youtube_api_key: { type: boolean }
            runner_token: { type: boolean }
            secret_key: { type: boolean }
        data_root: { type: string }
        brainthing_dir: { type: [string, "null"] }
        max_video_height: { type: integer }
        schedules: { $ref: "#/components/schemas/Schedules" }
        disk: { $ref: "#/components/schemas/DiskReport" }
        quota: { $ref: "#/components/schemas/Quota" }
    ChannelSummary:
      type: object
      required: [id, external_id, handle, title, thumbnail_url, country, followed, auto_track_new, is_mine, owned, tags, added_at, backfilled_at, last_synced_at, sync_error, syncing, subscribers, total_views, uploads, video_count, tracked_count, videos_by_format, disk_bytes]
      properties:
        id: { type: integer }
        external_id: { type: string }
        handle: { type: [string, "null"] }
        title: { type: string }
        thumbnail_url: { type: [string, "null"] }
        country: { type: [string, "null"] }
        followed: { type: boolean, description: Daily channel stats and new-upload checks }
        auto_track_new: { type: boolean, description: Pull new uploads automatically }
        is_mine: { type: boolean }
        owned: { type: boolean, description: Connected with YouTube owner sign-in }
        tags: { type: array, items: { type: string } }
        added_at: { type: [string, "null"] }
        backfilled_at: { type: [string, "null"] }
        last_synced_at: { type: [string, "null"] }
        sync_error: { type: [string, "null"] }
        syncing: { type: boolean }
        subscribers: { type: [integer, "null"] }
        total_views: { type: [integer, "null"] }
        uploads: { type: [integer, "null"], description: Upload count YouTube reports }
        video_count: { type: [integer, "null"], description: Videos stored (discovered + tracked) }
        tracked_count: { type: integer }
        videos_by_format:
          type: object
          additionalProperties: { type: integer }
        disk_bytes: { type: integer }
    ChannelDetail:
      allOf:
        - $ref: "#/components/schemas/ChannelSummary"
        - type: object
          required: [description, notes, uploads_playlist, published_at, url]
          properties:
            description: { type: [string, "null"] }
            notes: { type: [string, "null"] }
            uploads_playlist: { type: [string, "null"] }
            published_at: { type: [string, "null"] }
            url: { type: string }
    ChannelSnapshot:
      type: object
      required: [captured_at, subscribers, views, video_count]
      properties:
        captured_at: { type: string }
        subscribers: { type: [integer, "null"] }
        views: { type: [integer, "null"] }
        video_count: { type: [integer, "null"] }
    VideoFormat:
      type: string
      enum: [long, short, live, premiere]
    VideoSummary:
      type: object
      required: [id, external_id, channel_id, title, published_at, duration_s, format, aspect, views, likes, comments, outlier_score, outlier_baseline, thumbnail, has_thumbnail, gone, selection, tracked_at, url]
      properties:
        id: { type: integer }
        external_id: { type: string }
        channel_id: { type: integer }
        title: { type: string }
        published_at: { type: [string, "null"] }
        duration_s: { type: [integer, "null"] }
        format: { $ref: "#/components/schemas/VideoFormat" }
        aspect: { type: [number, "null"] }
        views: { type: [integer, "null"] }
        likes: { type: [integer, "null"] }
        comments: { type: [integer, "null"] }
        outlier_score: { type: [number, "null"] }
        outlier_baseline: { type: [number, "null"] }
        thumbnail: { type: string }
        has_thumbnail: { type: [boolean, "null"] }
        gone: { type: boolean }
        selection: { type: string, enum: [discovered, tracked] }
        tracked_at: { type: [string, "null"] }
        url: { type: string }
    VideoList:
      type: object
      required: [videos, total]
      properties:
        videos: { type: array, items: { $ref: "#/components/schemas/VideoSummary" } }
        total: { type: integer }
    VideoSnapshot:
      type: object
      required: [captured_at, views, likes, comments, source]
      properties:
        captured_at: { type: string }
        views: { type: [integer, "null"] }
        likes: { type: [integer, "null"] }
        comments: { type: [integer, "null"] }
        source: { type: string }
    Asset:
      type: object
      required: [id, kind, variant, path, bytes, width, height, codec, url, created_at]
      properties:
        id: { type: integer }
        kind: { type: string }
        variant: { type: string }
        path: { type: string }
        bytes: { type: [integer, "null"] }
        width: { type: [integer, "null"] }
        height: { type: [integer, "null"] }
        codec: { type: [string, "null"] }
        url: { type: string }
        created_at: { type: [string, "null"] }
    AnalyzerStatus:
      type: object
      required: [analyzer, version, title, runner_type, status, summary, error, job_id, output_path, computed_at]
      properties:
        analyzer: { type: string }
        version: { type: string }
        title: { type: string }
        runner_type: { type: string }
        status: { type: string, enum: [done, queued, running, failed, missing] }
        summary: { type: object, additionalProperties: true }
        error: { type: [string, "null"] }
        job_id: { type: [integer, "null"] }
        output_path: { type: [string, "null"] }
        computed_at: { type: [string, "null"] }
    VideoDetail:
      type: object
      required: [video, snapshots, assets, analyzers]
      properties:
        video:
          allOf:
            - $ref: "#/components/schemas/VideoSummary"
            - type: object
              required: [description, tags, category_id, language, privacy, discovered_at, last_snapshot_at, channel]
              properties:
                description: { type: [string, "null"] }
                tags: { type: array, items: { type: string } }
                category_id: { type: [string, "null"] }
                language: { type: [string, "null"] }
                privacy: { type: [string, "null"] }
                discovered_at: { type: [string, "null"] }
                last_snapshot_at: { type: [string, "null"] }
                channel:
                  type: object
                  required: [id, title, handle, is_mine, owned]
                  properties:
                    id: { type: integer }
                    title: { type: string }
                    handle: { type: [string, "null"] }
                    is_mine: { type: boolean }
                    owned: { type: boolean }
        snapshots: { type: array, items: { $ref: "#/components/schemas/VideoSnapshot" } }
        assets: { type: array, items: { $ref: "#/components/schemas/Asset" } }
        analyzers: { type: array, items: { $ref: "#/components/schemas/AnalyzerStatus" } }
    ChannelResponse:
      type: object
      required: [channel]
      properties:
        channel: { $ref: "#/components/schemas/ChannelDetail" }
    ChannelCard:
      type: object
      required: [external_id, title, handle, description, thumbnail_url, subscribers, video_count, total_views, channel_id]
      properties:
        external_id: { type: string }
        title: { type: string }
        handle: { type: [string, "null"] }
        description: { type: string }
        thumbnail_url: { type: [string, "null"] }
        subscribers: { type: [integer, "null"] }
        video_count: { type: [integer, "null"] }
        total_views: { type: [integer, "null"] }
        channel_id: { type: [integer, "null"], description: Set when the channel is already stored }
    DiscoverVideo:
      allOf:
        - $ref: "#/components/schemas/VideoSummary"
        - type: object
          required: [role, group]
          properties:
            role: { type: [string, "null"], description: "Study role, e.g. hit or flop" }
            group: { type: [string, "null"], description: "Study group, e.g. pair 3" }
    DiscoverVideos:
      type: object
      required: [videos, matching, listing]
      properties:
        videos: { type: array, items: { $ref: "#/components/schemas/DiscoverVideo" } }
        matching: { type: integer, description: Videos matching the filters before top/bottom N }
        listing:
          type: object
          required: [listed_at, fresh, syncing, error]
          properties:
            listed_at: { type: [string, "null"] }
            fresh: { type: boolean }
            syncing: { type: boolean }
            error: { type: [string, "null"] }
    PullResult:
      type: object
      required: [pulled, already_tracked, jobs]
      properties:
        pulled: { type: integer }
        already_tracked: { type: integer }
        jobs: { type: array, items: { type: integer } }
        study_added: { type: integer }
    JobProgress:
      type: object
      description: The runner's exact live state, e.g. stage "Whisper" on video 5 of 10 at 1%.
      properties:
        stage: { type: string }
        stage_index: { type: integer }
        stage_count: { type: integer }
        video_index: { type: integer }
        video_count: { type: integer }
        video_id: { type: integer }
        stage_percent: { type: number }
        overall_percent: { type: number }
        message: { type: string }
        eta_seconds: { type: number }
        updated_at: { type: string }
    JobSummary:
      type: object
      required: [id, type, analyzer, version, title, runner_type, status, priority, created_by, runner, progress, progress_text, items_total, items_by_status, attempts, depends_on, error, created_at, claimed_at, started_at, finished_at, elapsed_seconds]
      properties:
        id: { type: integer }
        type: { type: string }
        analyzer: { type: string }
        version: { type: string }
        title: { type: string }
        runner_type: { type: string }
        status: { type: string, enum: [queued, claimed, running, done, failed, cancelled] }
        priority: { type: integer }
        created_by: { type: string }
        runner:
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: integer }
            name: { type: string }
        progress: { $ref: "#/components/schemas/JobProgress" }
        progress_text: { type: string }
        items_total: { type: integer }
        items_by_status: { type: object, additionalProperties: { type: integer } }
        attempts: { type: integer }
        depends_on: { type: array, items: { type: integer } }
        error: { type: [string, "null"] }
        created_at: { type: [string, "null"] }
        claimed_at: { type: [string, "null"] }
        started_at: { type: [string, "null"] }
        finished_at: { type: [string, "null"] }
        elapsed_seconds: { type: [number, "null"] }
    StageTiming:
      type: object
      required: [stage, started_at, finished_at, seconds]
      properties:
        stage: { type: string }
        started_at: { type: string }
        finished_at: { type: [string, "null"] }
        seconds: { type: [number, "null"] }
    JobItemInfo:
      type: object
      required: [video_id, title, external_id, status, stage, error, started_at, finished_at]
      properties:
        video_id: { type: integer }
        title: { type: string }
        external_id: { type: string }
        status: { type: string }
        stage: { type: [string, "null"] }
        error: { type: [string, "null"] }
        started_at: { type: [string, "null"] }
        finished_at: { type: [string, "null"] }
    JobPayloadItem:
      type: object
      required: [video_id, external_id, channel_external_id, title, url, duration_s, format, language, inputs, output_dir, status]
      properties:
        video_id: { type: integer }
        external_id: { type: string }
        channel_external_id: { type: string }
        title: { type: string }
        url: { type: string }
        duration_s: { type: [integer, "null"] }
        format: { type: string }
        language: { type: [string, "null"] }
        inputs:
          type: object
          description: Local file paths in v1 (signed URLs for remote runners later), null when missing.
          additionalProperties: { type: [string, "null"] }
        output_dir: { type: string }
        status: { type: string }
    JobPayload:
      type: object
      required: [id, type, analyzer, version, status, params, attempt, max_video_height, data_root, runner_cache_dir, download_pause_seconds, items]
      properties:
        id: { type: integer }
        type: { type: string }
        analyzer: { type: string }
        version: { type: string }
        status: { type: string }
        params: { type: object, additionalProperties: true }
        attempt: { type: integer }
        max_video_height: { type: integer }
        data_root: { type: string }
        runner_cache_dir: { type: string }
        download_pause_seconds: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/JobPayloadItem" } }
    JobDetail:
      allOf:
        - $ref: "#/components/schemas/JobSummary"
        - type: object
          required: [params, stage_timings, log_tail, items, payload]
          properties:
            params: { type: object, additionalProperties: true }
            stage_timings: { type: array, items: { $ref: "#/components/schemas/StageTiming" } }
            log_tail: { type: [string, "null"] }
            items: { type: array, items: { $ref: "#/components/schemas/JobItemInfo" } }
            payload: { $ref: "#/components/schemas/JobPayload" }
    RunnerInfo:
      type: object
      required: [id, name, type, gpu, host, version, capabilities, info, online, last_heartbeat, current_job_id]
      properties:
        id: { type: integer }
        name: { type: string }
        type: { type: string, enum: [cpu, gpu] }
        gpu: { type: [string, "null"] }
        host: { type: [string, "null"] }
        version: { type: [string, "null"] }
        capabilities: { type: array, items: { type: string } }
        info: { type: object, additionalProperties: true }
        online: { type: boolean }
        last_heartbeat: { type: [string, "null"] }
        current_job_id: { type: [integer, "null"] }
    AnalyzerInfo:
      type: object
      required: [name, version, ref, title, description, runner_type, inputs, output_format, applies_to, is_current]
      properties:
        name: { type: string }
        version: { type: string }
        ref: { type: string }
        title: { type: string }
        description: { type: string }
        runner_type: { type: string, enum: [builtin, cpu, gpu] }
        inputs: { type: array, items: { type: string } }
        output_format: { type: string }
        applies_to: { type: array, items: { type: string } }
        is_current: { type: boolean }
    CoverageCell:
      type: object
      required: [status, job_id]
      properties:
        status: { type: string, enum: [done, queued, running, failed, missing, n/a] }
        job_id: { type: [integer, "null"] }
    Coverage:
      type: object
      required: [analyzers, videos, total]
      properties:
        analyzers:
          type: array
          items:
            type: object
            required: [name, version, title, runner_type]
            properties:
              name: { type: string }
              version: { type: string }
              title: { type: string }
              runner_type: { type: string }
        videos:
          type: array
          items:
            type: object
            required: [video_id, title, channel_id, format, published_at, selection, cells]
            properties:
              video_id: { type: integer }
              title: { type: string }
              channel_id: { type: integer }
              format: { type: string }
              published_at: { type: [string, "null"] }
              selection: { type: string }
              cells: { type: object, additionalProperties: { $ref: "#/components/schemas/CoverageCell" } }
        total: { type: integer }
    JobResponse:
      type: object
      required: [job]
      properties:
        job: { $ref: "#/components/schemas/JobSummary" }
    OwnerSync:
      type: object
      required: [id, channel_id, mode, status, counts, unavailable, error, log, started_by, started_at, finished_at]
      properties:
        id: { type: integer }
        channel_id: { type: integer }
        mode: { type: string, enum: [full, new] }
        status: { type: string, enum: [running, done, failed] }
        counts: { type: object, additionalProperties: { type: integer } }
        unavailable:
          type: object
          description: Metrics or reports the API refused, by report name
          additionalProperties: { type: array, items: { type: string } }
        error: { type: [string, "null"] }
        log: { type: array, items: { type: string } }
        started_by: { type: string }
        started_at: { type: [string, "null"] }
        finished_at: { type: [string, "null"] }
    OwnerCredentialInfo:
      type: object
      required: [channel, status, status_detail, scopes, connected_by, connected_at, last_used_at, last_sync, last_finished_sync, synced_videos]
      properties:
        channel:
          type: object
          required: [id, title, handle, thumbnail_url]
          properties:
            id: { type: integer }
            title: { type: string }
            handle: { type: [string, "null"] }
            thumbnail_url: { type: [string, "null"] }
        status: { type: string, enum: [active, expired, revoked] }
        status_detail: { type: [string, "null"] }
        scopes: { type: array, items: { type: string } }
        connected_by: { type: string }
        connected_at: { type: [string, "null"] }
        last_used_at: { type: [string, "null"] }
        last_sync: { oneOf: [{ $ref: "#/components/schemas/OwnerSync" }, { type: "null" }] }
        last_finished_sync: { oneOf: [{ $ref: "#/components/schemas/OwnerSync" }, { type: "null" }] }
        synced_videos: { type: integer }
    RetentionPointInfo:
      type: object
      required: [ratio, seconds, watch_ratio, relative]
      properties:
        ratio: { type: number }
        seconds: { type: [number, "null"] }
        watch_ratio: { type: [number, "null"] }
        relative: { type: [number, "null"] }
    Engagement:
      type: object
      required: [owned, duration_s, retention, lifetime, daily, breakdowns, tribe]
      properties:
        owned: { type: boolean }
        duration_s: { type: [integer, "null"] }
        retention:
          type: object
          required: [sync_id, versions, curves]
          properties:
            sync_id: { type: [integer, "null"] }
            versions: { type: array, items: { type: integer } }
            curves:
              type: object
              description: Keyed by audience type (ALL, ORGANIC, AD_INSTREAM, ...)
              additionalProperties: { type: array, items: { $ref: "#/components/schemas/RetentionPointInfo" } }
        lifetime: { type: [object, "null"], additionalProperties: true }
        daily:
          type: array
          items:
            type: object
            required: [day]
            properties:
              day: { type: string }
              views: { type: [integer, "null"] }
              estimated_minutes_watched: { type: [number, "null"] }
              average_view_duration: { type: [number, "null"] }
              average_view_percentage: { type: [number, "null"] }
              likes: { type: [integer, "null"] }
              comments: { type: [integer, "null"] }
              shares: { type: [integer, "null"] }
              subscribers_gained: { type: [integer, "null"] }
              subscribers_lost: { type: [integer, "null"] }
        breakdowns:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              required: [key]
              properties:
                key: { type: string }
              additionalProperties: true
        tribe:
          oneOf:
            - type: "null"
            - type: object
              required: [t, engagement, networks, definition]
              properties:
                t: { type: array, items: { type: number } }
                engagement: { type: array, items: { type: [number, "null"] } }
                networks: { type: object, additionalProperties: { type: array, items: { type: [number, "null"] } } }
                definition: { type: string }
  parameters:
    JobId: { name: job_id, in: path, required: true, schema: { type: integer } }
    RunnerIdHeader: { name: X-Runner-Id, in: header, schema: { type: string }, description: The calling runner's id; mismatches get 409 }
    ChannelId: { name: channel_id, in: path, required: true, schema: { type: integer } }
    VideoId: { name: video_id, in: path, required: true, schema: { type: integer } }
    VideoListQuery:
      name: q
      in: query
      schema: { type: string }
      description: Title search
    VideoFormatQuery: { name: format, in: query, schema: { type: string }, description: "Comma-separated formats" }
    VideoSort:
      name: sort
      in: query
      schema: { type: string, enum: [published_at, views, outlier_score, duration_s, title, likes, comments] }
    VideoOrder: { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
    Limit: { name: limit, in: query, schema: { type: string }, description: 'Number, or "all" (max 5000)' }
    Offset: { name: offset, in: query, schema: { type: integer } }
    MinOutlier: { name: min_outlier, in: query, schema: { type: number } }
    MaxOutlier: { name: max_outlier, in: query, schema: { type: number } }
    IncludeGone: { name: include_gone, in: query, schema: { type: string, enum: ["1"] } }
    Selection: { name: selection, in: query, schema: { type: string, enum: [discovered, tracked] } }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
paths:
  /api/health:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                type: object
                required: [ok, time]
                properties:
                  ok: { type: boolean }
                  time: { type: string }
  /api/openapi.json:
    get:
      operationId: openapi
      security: []
      responses:
        "200": { description: This document as JSON }
  /api/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                remember: { type: boolean }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /api/auth/logout:
    post:
      operationId: logout
      security: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /api/auth/me:
    get:
      operationId: me
      security: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserResponse" }
        "401": { $ref: "#/components/responses/Error" }
  /api/auth/password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 10 }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /api/dashboard:
    get:
      operationId: dashboard
      parameters:
        - { name: refresh, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dashboard" }
  /api/settings:
    get:
      operationId: getSettings
      responses:
        "200":
          description: Settings (secrets only as set / not set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
  /api/settings/schedules:
    put:
      operationId: putSchedules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: integer }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules: { $ref: "#/components/schemas/Schedules" }
        "400": { $ref: "#/components/responses/Error" }
  /api/channels:
    get:
      operationId: listChannels
      responses:
        "200":
          description: All channels with latest stats
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels: { type: array, items: { $ref: "#/components/schemas/ChannelSummary" } }
    post:
      operationId: addChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel: { type: string, description: "URL, @handle or UC... id" }
                is_mine: { type: boolean }
                follow: { type: boolean }
                tags: { type: array, items: { type: string } }
                list_uploads: { type: boolean, description: List all uploads (metadata only). Default true. }
      responses:
        "200": &channelCreated
          description: Channel (already existed / created). Uploads are listed in the background; nothing is downloaded.
          content:
            application/json:
              schema:
                type: object
                required: [channel, created]
                properties:
                  channel: { $ref: "#/components/schemas/ChannelSummary" }
                  created: { type: boolean }
        "201": *channelCreated
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /api/channels/{channel_id}:
    parameters: [{ $ref: "#/components/parameters/ChannelId" }]
    get:
      operationId: getChannel
      responses:
        "200":
          description: Channel
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelResponse" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                followed: { type: boolean }
                auto_track_new: { type: boolean }
                is_mine: { type: boolean }
                tags: { type: array, items: { type: string } }
                notes: { type: [string, "null"] }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelResponse" }
    delete:
      operationId: deleteChannel
      parameters:
        - { name: delete_files, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: Deleted with all its videos and history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /api/channels/{channel_id}/snapshots:
    parameters: [{ $ref: "#/components/parameters/ChannelId" }]
    get:
      operationId: channelSnapshots
      responses:
        "200":
          description: Subscriber/view history
          content:
            application/json:
              schema:
                type: object
                required: [snapshots]
                properties:
                  snapshots: { type: array, items: { $ref: "#/components/schemas/ChannelSnapshot" } }
  /api/channels/{channel_id}/videos:
    parameters: [{ $ref: "#/components/parameters/ChannelId" }]
    get:
      operationId: channelVideos
      parameters: &videoListParams
        - { $ref: "#/components/parameters/VideoListQuery" }
        - { $ref: "#/components/parameters/VideoFormatQuery" }
        - { $ref: "#/components/parameters/VideoSort" }
        - { $ref: "#/components/parameters/VideoOrder" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
        - { $ref: "#/components/parameters/MinOutlier" }
        - { $ref: "#/components/parameters/MaxOutlier" }
        - { $ref: "#/components/parameters/IncludeGone" }
        - { $ref: "#/components/parameters/Selection" }
      responses:
        "200":
          description: Videos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoList" }
  /api/videos:
    get:
      operationId: listVideos
      parameters:
        - { name: channel_id, in: query, schema: { type: string }, description: "Comma-separated channel ids" }
        - { name: is_mine, in: query, schema: { type: string, enum: ["1"] } }
        - { $ref: "#/components/parameters/VideoListQuery" }
        - { $ref: "#/components/parameters/VideoFormatQuery" }
        - { $ref: "#/components/parameters/VideoSort" }
        - { $ref: "#/components/parameters/VideoOrder" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Offset" }
        - { $ref: "#/components/parameters/MinOutlier" }
        - { $ref: "#/components/parameters/MaxOutlier" }
        - { $ref: "#/components/parameters/IncludeGone" }
        - { $ref: "#/components/parameters/Selection" }
      responses:
        "200":
          description: Videos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoList" }
  /api/videos/{video_id}:
    parameters: [{ $ref: "#/components/parameters/VideoId" }]
    get:
      operationId: getVideo
      responses:
        "200":
          description: Video with history, files and analyzer results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /api/videos/{video_id}/refresh:
    parameters: [{ $ref: "#/components/parameters/VideoId" }]
    post:
      operationId: refreshVideo
      responses:
        "200":
          description: Refreshed metadata and stats (1 quota unit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /api/videos/{video_id}/thumbnail:
    parameters: [{ $ref: "#/components/parameters/VideoId" }]
    get:
      operationId: videoThumbnail
      responses:
        "200": { description: JPEG }
        "302": { description: Redirect to YouTube's copy until it is downloaded }
  /api/assets/{asset_id}/file:
    parameters: [{ name: asset_id, in: path, required: true, schema: { type: integer } }]
    get:
      operationId: assetFile
      description: The file, with HTTP Range support.
      responses:
        "200": { description: File }
        "206": { description: Partial content }
        "404": { $ref: "#/components/responses/Error" }
  /api/channels/{channel_id}/refresh:
    parameters: [{ $ref: "#/components/parameters/ChannelId" }]
    post:
      operationId: refreshChannel
      description: Re-list all uploads in the background (refreshes discovered videos). Skipped if listed in the last 6 hours unless force=1.
      parameters:
        - { name: force, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: Started, already running, or still fresh
          content:
            application/json:
              schema:
                type: object
                required: [started, already_running, fresh]
                properties:
                  started: { type: boolean }
                  already_running: { type: boolean }
                  fresh: { type: boolean }
  /api/discover/search:
    get:
      operationId: discoverSearch
      description: Channel search. A name uses search.list (100 quota units); a URL, @handle or UC id resolves directly (1-2 units).
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 25 } }
      responses:
        "200":
          description: Matching channels
          content:
            application/json:
              schema:
                type: object
                required: [channels]
                properties:
                  channels:
                    type: array
                    items: { $ref: "#/components/schemas/ChannelCard" }
        "429": { $ref: "#/components/responses/Error" }
  /api/discover/channels/{channel_id}/videos:
    parameters: [{ $ref: "#/components/parameters/ChannelId" }]
    get:
      operationId: discoverChannelVideos
      parameters:
        - { name: timeframe, in: query, schema: { type: string, enum: [7d, 30d, 90d, 1y, all, custom] } }
        - { name: since, in: query, schema: { type: string, format: date } }
        - { name: until, in: query, schema: { type: string, format: date } }
        - { name: rank, in: query, schema: { type: string, enum: [outlier, views] } }
        - { name: pick, in: query, schema: { type: string, enum: [top, bottom, all] } }
        - { name: n, in: query, schema: { type: integer } }
        - { name: formats, in: query, schema: { type: string }, description: "Comma-separated: long,short" }
        - { name: include_live, in: query, schema: { type: string, enum: ["1"] } }
        - { name: min_duration, in: query, schema: { type: integer } }
        - { $ref: "#/components/parameters/Selection" }
        - { name: study_id, in: query, schema: { type: integer }, description: Show only the videos this study's criteria would include }
      responses:
        "200":
          description: Filtered uploads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverVideos" }
  /api/discover/pull:
    post:
      operationId: discoverPull
      description: Mark videos tracked, snapshot their stats and queue download/captions jobs (1080p cap).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [video_ids]
              properties:
                video_ids: { type: array, items: { type: integer }, maxItems: 2000 }
                study_id: { type: [integer, "null"], description: Also add the videos to this study }
      responses:
        "200":
          description: Pulled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PullResult" }
        "404": { $ref: "#/components/responses/Error" }
  /api/runners/register:
    post:
      operationId: registerRunner
      security: [{ runner: [] }]
      description: Register (or re-register) a runner. Jobs it held before a restart are requeued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type, capabilities]
              properties:
                name: { type: string }
                type: { type: string, enum: [cpu, gpu] }
                capabilities: { type: array, items: { type: string }, description: Job types this runner can run }
                gpu: { type: [string, "null"] }
                host: { type: [string, "null"] }
                version: { type: [string, "null"] }
                info: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                required: [runner]
                properties:
                  runner: { $ref: "#/components/schemas/RunnerInfo" }
        "401": { $ref: "#/components/responses/Error" }
  /api/runners/{runner_id}/heartbeat:
    parameters: [{ name: runner_id, in: path, required: true, schema: { type: integer } }]
    post:
      operationId: runnerHeartbeat
      security: [{ runner: [] }]
      description: Liveness. A job whose runner is silent for 10 minutes (a setting) is requeued.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                info: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Alive. Lists this runner's jobs that were cancelled, so it can stop them.
          content:
            application/json:
              schema:
                type: object
                required: [ok, cancelled_jobs]
                properties:
                  ok: { type: boolean }
                  cancelled_jobs: { type: array, items: { type: integer } }
  /api/jobs/claim:
    post:
      operationId: claimJob
      security: [{ runner: [] }]
      description: Atomically claim the next ready job of an advertised type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [runner_id]
              properties:
                runner_id: { type: integer }
                types: { type: array, items: { type: string } }
      responses:
        "200":
          description: The claimed job, or null when there is nothing to do
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job:
                    oneOf:
                      - $ref: "#/components/schemas/JobPayload"
                      - type: "null"
  /api/jobs/{job_id}/progress:
    parameters: [{ $ref: "#/components/parameters/JobId" }, { $ref: "#/components/parameters/RunnerIdHeader" }]
    post:
      operationId: jobProgress
      security: [{ runner: [] }]
      description: Exact live state, every few seconds. Optional `log` text is appended to the job log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/JobProgress"
                - type: object
                  properties:
                    log: { type: string }
      responses:
        "200":
          description: Stored. cancel=true means stop working on this job.
          content:
            application/json:
              schema:
                type: object
                required: [cancel]
                properties:
                  cancel: { type: boolean }
        "409": { $ref: "#/components/responses/Error" }
  /api/jobs/{job_id}/items/{video_id}/result:
    parameters:
      - { $ref: "#/components/parameters/JobId" }
      - { $ref: "#/components/parameters/VideoId" }
      - { $ref: "#/components/parameters/RunnerIdHeader" }
    post:
      operationId: jobItemResult
      security: [{ runner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [done, failed] }
                error: { type: [string, "null"] }
                summary: { type: object, additionalProperties: true }
                output_path: { type: [string, "null"] }
                assets:
                  type: array
                  items:
                    type: object
                    required: [kind, path]
                    properties:
                      kind: { type: string, enum: [video, audio, thumbnail, captions, captions_text, info] }
                      path: { type: string, description: Must be inside the data folder }
                      variant: { type: string }
                      bytes: { type: integer }
                      sha256: { type: string }
                      width: { type: integer }
                      height: { type: integer }
                      codec: { type: string }
                      meta: { type: object, additionalProperties: true }
                video_updates:
                  type: object
                  properties:
                    format: { type: string, enum: [live, premiere] }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/jobs/{job_id}/complete:
    parameters: [{ $ref: "#/components/parameters/JobId" }, { $ref: "#/components/parameters/RunnerIdHeader" }]
    post:
      operationId: completeJob
      security: [{ runner: [] }]
      responses:
        "200":
          description: Finished
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResponse" }
  /api/jobs/{job_id}/fail:
    parameters: [{ $ref: "#/components/parameters/JobId" }, { $ref: "#/components/parameters/RunnerIdHeader" }]
    post:
      operationId: failJob
      security: [{ runner: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [error]
              properties:
                error: { type: string }
                log_tail: { type: string }
                retry: { type: boolean, description: Requeue if attempts remain (transient errors) }
      responses:
        "200":
          description: Failed (or requeued)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResponse" }
  /api/jobs/{job_id}/log:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    get:
      operationId: jobLog
      parameters:
        - { name: tail, in: query, schema: { type: integer, maximum: 5000 } }
      responses:
        "200":
          description: The last lines of the job log
          content:
            application/json:
              schema:
                type: object
                required: [log]
                properties:
                  log: { type: string }
    post:
      operationId: appendJobLog
      security: [{ runner: [] }]
      parameters: [{ $ref: "#/components/parameters/RunnerIdHeader" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        "200":
          description: Appended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /api/jobs/{job_id}:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    get:
      operationId: getJob
      security: [{ session: [] }, { runner: [] }]
      description: Job detail, including the runner payload (params, per-video local input paths and output dir).
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                type: object
                required: [job]
                properties:
                  job: { $ref: "#/components/schemas/JobDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /api/jobs/{job_id}/cancel:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    post:
      operationId: cancelJob
      responses:
        "200":
          description: Cancelled (and jobs waiting on it)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /api/jobs/{job_id}/retry:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    post:
      operationId: retryJob
      description: A new job for this job's videos that did not finish.
      responses:
        "200":
          description: The new job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResponse" }
        "400": { $ref: "#/components/responses/Error" }
  /api/jobs:
    get:
      operationId: listJobs
      parameters:
        - { name: status, in: query, schema: { type: string }, description: Comma-separated statuses }
        - { name: type, in: query, schema: { type: string }, description: Comma-separated job types }
        - { name: video_id, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Jobs, newest first
          content:
            application/json:
              schema:
                type: object
                required: [jobs, total]
                properties:
                  jobs: { type: array, items: { $ref: "#/components/schemas/JobSummary" } }
                  total: { type: integer }
    post:
      operationId: createJobs
      description: Issue jobs. Videos that already have the result (unless force) or an active job are skipped; a download is chained first when an analyzer needs the video file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                analyzer: { type: string }
                video_ids: { type: array, items: { type: integer } }
                requests:
                  type: array
                  items:
                    type: object
                    required: [analyzer, video_ids]
                    properties:
                      analyzer: { type: string }
                      video_ids: { type: array, items: { type: integer } }
                      params: { type: object, additionalProperties: true }
                params: { type: object, additionalProperties: true }
                priority: { type: integer }
                force: { type: boolean }
      responses:
        "200":
          description: Issued jobs (including chained downloads) and analyzers with nothing to do
          content:
            application/json:
              schema:
                type: object
                required: [jobs, skipped]
                properties:
                  jobs: { type: array, items: { $ref: "#/components/schemas/JobSummary" } }
                  skipped: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
  /api/jobs/stream:
    get:
      operationId: jobsStream
      description: "Server-sent events (event: jobs) with active and recently finished jobs whenever they change."
      parameters:
        - { name: once, in: query, schema: { type: string, enum: ["1"] } }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
  /api/runners:
    get:
      operationId: listRunners
      responses:
        "200":
          description: Registered runners
          content:
            application/json:
              schema:
                type: object
                required: [runners]
                properties:
                  runners: { type: array, items: { $ref: "#/components/schemas/RunnerInfo" } }
  /api/analyzers:
    get:
      operationId: listAnalyzers
      responses:
        "200":
          description: Analyzer registry (every version)
          content:
            application/json:
              schema:
                type: object
                required: [analyzers]
                properties:
                  analyzers: { type: array, items: { $ref: "#/components/schemas/AnalyzerInfo" } }
  /api/coverage:
    get:
      operationId: coverage
      parameters:
        - { name: channel_id, in: query, schema: { type: string } }
        - { name: selection, in: query, schema: { type: string, enum: [tracked, discovered, all] } }
        - { name: format, in: query, schema: { type: string } }
        - { name: video_ids, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 2000 } }
        - { $ref: "#/components/parameters/Offset" }
      responses:
        "200":
          description: Videos x analyzers status grid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Coverage" }
  /api/youtube/owner:
    get:
      operationId: ownerStatus
      responses:
        "200":
          description: OAuth configuration and connected channels (never any token)
          content:
            application/json:
              schema:
                type: object
                required: [configured, redirect_uri, scopes, credentials]
                properties:
                  configured: { type: boolean }
                  redirect_uri: { type: [string, "null"] }
                  scopes: { type: array, items: { type: string } }
                  credentials: { type: array, items: { $ref: "#/components/schemas/OwnerCredentialInfo" } }
  /api/youtube/oauth/start:
    post:
      operationId: ownerOauthStart
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                return_to: { type: string, description: "Path on this site to come back to (default /settings)" }
      responses:
        "200":
          description: Google's consent URL (single-use state, PKCE)
          content:
            application/json:
              schema:
                type: object
                required: [auth_url]
                properties:
                  auth_url: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /api/youtube/oauth/callback:
    get:
      operationId: ownerOauthCallback
      security: []
      description: Google redirects here. Checked by the single-use state; redirects back with ?youtube=connected or ?youtube=error.
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { description: Back to the app }
        "400": { description: Unknown or expired state }
  /api/youtube/owner/{channel_id}/sync:
    parameters: [{ $ref: "#/components/parameters/ChannelId" }]
    post:
      operationId: ownerSyncStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [full, new], description: "full = re-pull everything (new retention version); new = only uploads since the last sync and never-synced ones" }
      responses:
        "200":
          description: Started in the background
          content:
            application/json:
              schema:
                type: object
                required: [sync]
                properties:
                  sync: { $ref: "#/components/schemas/OwnerSync" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /api/youtube/owner/syncs/{sync_id}:
    parameters: [{ name: sync_id, in: path, required: true, schema: { type: integer } }]
    get:
      operationId: ownerSyncGet
      responses:
        "200":
          description: Sync progress and counts
          content:
            application/json:
              schema:
                type: object
                required: [sync]
                properties:
                  sync: { $ref: "#/components/schemas/OwnerSync" }
  /api/youtube/owner/{channel_id}:
    parameters: [{ $ref: "#/components/parameters/ChannelId" }]
    delete:
      operationId: ownerDisconnect
      description: Revoke the grant at Google and forget the token.
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
  /api/videos/{video_id}/engagement:
    parameters: [{ $ref: "#/components/parameters/VideoId" }]
    get:
      operationId: videoEngagement
      parameters:
        - { name: sync_id, in: query, schema: { type: integer }, description: Retention snapshot version (default latest) }
      responses:
        "200":
          description: Owner analytics for the video, with the TRIBE engagement curve when available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Engagement" }
  /api/videos/{video_id}/heatmap:
    parameters: [{ $ref: "#/components/parameters/VideoId" }]
    get:
      operationId: videoHeatmap
      description: Public 'Most replayed' heatmap (yt-dlp). Stored apart from the owner's real retention curves.
      parameters:
        - { name: capture_id, in: query, schema: { type: integer }, description: A specific capture (default latest with points) }
      responses:
        "200":
          description: Heatmap and chapters for one capture, plus the list of captures
          content:
            application/json:
              schema:
                type: object
                required: [captures, capture_id, duration_s, points, chapters]
                properties:
                  captures:
                    type: array
                    items:
                      type: object
                      required: [id, captured_at, source, heatmap_points, chapter_count, snapshot]
                      properties:
                        id: { type: integer }
                        captured_at: { type: [string, "null"] }
                        source: { type: string, enum: [download, heatmap] }
                        heatmap_points: { type: integer }
                        chapter_count: { type: integer }
                        snapshot: { type: object, additionalProperties: true }
                  capture_id: { type: [integer, "null"] }
                  duration_s: { type: [integer, "null"] }
                  points:
                    type: array
                    items:
                      type: object
                      required: [start_s, end_s, value]
                      properties:
                        start_s: { type: number }
                        end_s: { type: number }
                        value: { type: number }
                  chapters:
                    type: array
                    items:
                      type: object
                      required: [start_s, end_s, title]
                      properties:
                        start_s: { type: number }
                        end_s: { type: [number, "null"] }
                        title: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /api/brain/assets/{name}:
    parameters: [{ name: name, in: path, required: true, schema: { type: string, enum: [mesh.json, mesh.bin, atlas.json] } }]
    get:
      operationId: brainAsset
      description: fsaverage5 inflated mesh (mesh.json describes the arrays in mesh.bin) and the HCP-MMP1 atlas, exported by the TRIBE runner.
      responses:
        "200": { description: The file }
        "404": { $ref: "#/components/responses/Error" }
  /api/videos/{video_id}/brain:
    parameters: [{ $ref: "#/components/parameters/VideoId" }]
    get:
      operationId: videoBrain
      parameters:
        - { name: analyzer, in: query, schema: { type: string, enum: [tribe_video, tribe_title] } }
      responses:
        "200":
          description: Brain player metadata for the video's TRIBE result
          content:
            application/json:
              schema:
                type: object
                required: [video_id, analyzer, result_id, n_timesteps, n_vertices, tr_s, start_s, hrf_offset_s, scale, networks, peaks, frames_url, max_frames_per_request]
                properties:
                  video_id: { type: integer }
                  analyzer: { type: string }
                  result_id: { type: integer }
                  n_timesteps: { type: integer }
                  n_vertices: { type: integer }
                  tr_s: { type: number }
                  start_s: { type: array, items: { type: number } }
                  hrf_offset_s: { type: [number, "null"] }
                  scale:
                    type: object
                    description: "uint8 code 0 = no prediction; 1..255 = lo..hi linearly; 128 = 0"
                    required: [version, lo, hi, zero_code, nan_code, levels]
                    properties:
                      version: { type: integer }
                      lo: { type: number }
                      hi: { type: number }
                      zero_code: { type: integer }
                      nan_code: { type: integer }
                      levels: { type: integer }
                  networks:
                    oneOf:
                      - type: "null"
                      - type: object
                        required: [t, networks]
                        properties:
                          t: { type: array, items: { type: number } }
                          networks: { type: object, additionalProperties: { type: array, items: { type: [number, "null"] } } }
                  peaks:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        required: [t, value]
                        properties:
                          t: { type: number }
                          value: { type: number }
                  frames_url: { type: string }
                  max_frames_per_request: { type: integer }
        "404": { $ref: "#/components/responses/Error" }
  /api/videos/{video_id}/brain/frames:
    parameters: [{ $ref: "#/components/parameters/VideoId" }]
    get:
      operationId: videoBrainFrames
      description: "uint8 frames, count x n_vertices row-major (left hemisphere then right). Headers X-Frame-Start, X-Frame-Count, X-Vertices."
      parameters:
        - { name: analyzer, in: query, schema: { type: string } }
        - { name: start, in: query, schema: { type: integer } }
        - { name: count, in: query, schema: { type: integer, maximum: 600 } }
      responses:
        "200":
          description: Binary frames
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
